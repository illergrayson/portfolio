<!doctype html>
<!-- Source for public/og.jpg. Regenerate: install @fontsource/inter + @fontsource/instrument-serif, fix font paths, screenshot at 1200x630. -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Inter'; font-weight: 400; src: url('../node_modules-fonts/node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 500; src: url('../node_modules-fonts/node_modules/@fontsource/inter/files/inter-latin-500-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 600; src: url('../node_modules-fonts/node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 800; src: url('../node_modules-fonts/node_modules/@fontsource/inter/files/inter-latin-800-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Instrument Serif'; font-weight: 400; src: url('../node_modules-fonts/node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-normal.woff2') format('woff2'); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px;
    font-family: 'Inter', sans-serif;
    background: #FAF8F5;
    color: #1C1917;
    position: relative;
    overflow: hidden;
  }
  .glow {
    position: absolute; right: -220px; top: -220px;
    width: 640px; height: 640px; border-radius: 50%;
    background: radial-gradient(circle, rgba(194,114,78,0.16) 0%, rgba(194,114,78,0) 70%);
  }
  .wrap { position: absolute; inset: 0; padding: 84px 96px; display: flex; flex-direction: column; justify-content: center; }
  .badge {
    display: inline-flex; align-items: center; gap: 10px;
    border: 1px solid rgba(28,25,23,0.12); background: rgba(28,25,23,0.03);
    border-radius: 999px; padding: 10px 18px;
    font-size: 20px; color: rgba(28,25,23,0.6);
    width: fit-content;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #3E9B6B; }
  h1 {
    margin-top: 34px;
    font-size: 118px; font-weight: 800; letter-spacing: -0.045em; line-height: 0.98;
  }
  .sub { margin-top: 26px; font-size: 40px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.25; color: rgba(28,25,23,0.82); max-width: 980px; }
  .sub .accent { color: #C2724E; }
  .foot { position: absolute; left: 96px; right: 96px; bottom: 64px; display: flex; align-items: center; justify-content: space-between; font-size: 24px; color: rgba(28,25,23,0.45); }
  .serif { font-family: 'Instrument Serif', serif; font-size: 28px; color: rgba(194,114,78,0.85); }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="wrap">
    <h1>Grayson Iller</h1>
    <p class="sub">Product design and human factors.</p>
  </div>
  <div class="foot">
    <span>Human factors &middot; Skydio &middot; VUE (vueniverse.com)</span>
    <span class="serif">Portfolio</span>
  </div>
</body>
</html>
